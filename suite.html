</style></head><body><header><div class="brand"><img class="forge-brand-logo" src="/forge-logo-small.png" alt="NTV Forge pixel-art television" title="Forged with Aether · imagined with Sean"><div><div class="eyebrow">NOSTALGIATV / COMPANION SYSTEM</div><h1>NTV <span>FORGE</span></h1><div class="sub">RETRO TERMINAL · VERSION 1.3.2c · HEADER HOTFIX</div></div></div><div class="right"><div class="terminal" tabindex="0" role="button" aria-expanded="false" aria-label="Expand Forge system monitor" onclick="toggleMonitor()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleMonitor()}"><div class="terminal-label"><span class="led"></span>FORGE SYSTEM MONITOR <span class="terminal-cursor">█</span></div><div class="terminal-lines" id="terminalLines" role="log" aria-live="off"><div>&gt; SYSTEM ONLINE</div></div></div><nav aria-label="Forge workspaces"><button id="linkTab" aria-selected="true" onclick="switchTab('link')">01 / LINK FORGE</button><button id="channelTab" aria-selected="false" onclick="switchTab('channel')">02 / CHANNEL FORGE</button><span id="archiveUnlockSlot"><img src="/forge-logo-small.png" class="forge-right-logo" alt="Pixel-art television"></span><button id="archiveTab" hidden aria-selected="false" onclick="switchTab('archive')">03 / ARCHIVE FORGE</button></nav></div></header><div id="linkEncoderBar" class="link-encoder-bar"><label class="encoder-control" title="Choose the encoder for newly started streams">ENCODER <select id="encoderMode" aria-label="Streaming encoder"><option value="auto">AUTO</option><option value="qsv">QUICK SYNC</option><option value="software">SOFTWARE</option></select></label></div><div id="monitorExpanded" hidden><div class="expanded-head">▣ SYSTEM EVENT LOG <button onclick="toggleMonitor()">CLOSE ×</button></div><div id="monitorHistory"></div><div class="monitor-command"><label for="forgeCommand">FORGE&gt; </label><input id="forgeCommand" autocomplete="off" spellcheck="false" aria-label="Forge terminal input" maxlength="160" placeholder="_"><button id="forgeSubmit" type="button">ENTER ↵</button><button id="forgeReset" type="button" hidden>RESET ACHIEVEMENT</button><small>AWAITING INPUT</small></div><div id="forgeAchievement" hidden role="status" aria-live="polite"></div></div><iframe id="linkFrame" title="Link Forge" src="/link"></iframe><iframe id="channelFrame" title="Channel Forge" src="/forge" hidden></iframe><iframe id="archiveFrame" title="Archive Forge" data-src="/archive" hidden></iframe><script>function switchTab(which){if(which==='archive'&&!window.archiveUnlocked)which='link';const link=which==='link';const archive=which==='archive';document.getElementById('linkFrame').hidden=!link;document.getElementById('channelFrame').hidden=link||archive;document.getElementById('linkFrame').hidden=!link;document.getElementById('archiveFrame').hidden=!archive;document.getElementById('linkTab').setAttribute('aria-selected',String(link));document.getElementById('channelTab').setAttribute('aria-selected',String(!link&&!archive));document.getElementById('archiveTab').setAttribute('aria-selected',String(archive));if(archive){const f=document.getElementById('archiveFrame');if(!f.src)f.src=f.dataset.src;}document.getElementById('linkEncoderBar').hidden=!link;history.replaceState(null,'',link?'#link':archive?'#archive':'#channel')}switchTab(location.hash==='#channel'?'channel':'link');</script><script>
function toggleMonitor(){const panel=document.getElementById('monitorExpanded'),opened=panel.hidden;panel.hidden=!opened;document.querySelector('.terminal').setAttribute('aria-expanded',String(opened));if(opened)document.getElementById('monitorHistory').scrollTop=999999}
const terminalLines=document.getElementById('terminalLines');
const seenEvents=new Set();
function terminalAdd(message){
 const div=document.createElement('div');div.textContent='> '+String(message).replace(/[\r\n]/g,' ').slice(0,110);
 terminalLines.appendChild(div);const full=div.cloneNode(true);document.getElementById('monitorHistory').appendChild(full);const history=document.getElementById('monitorHistory');while(history.children.length>200)history.firstChild.remove();while(terminalLines.children.length>75)terminalLines.firstChild.remove();terminalLines.scrollTop=terminalLines.scrollHeight;
}
window.addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.data&&typeof event.data.forgeStatus==='string')terminalAdd(event.data.forgeStatus)});
async function terminalPoll(){
 try{const r=await fetch('/api/events',{cache:'no-store'});if(!r.ok)throw Error('offline');const payload=await r.json();
 for(const e of payload.events||[]){const key=[e.time,e.event,e.channel,e.mode].join('|');if(seenEvents.has(key))continue;seenEvents.add(key);if(seenEvents.size>500)seenEvents.clear();
 const label=String(e.event||'EVENT').replaceAll('_',' ').toUpperCase();terminalAdd((e.time?e.time+' ':'')+label+(e.channel?' / '+e.channel:''));}
 }catch(e){/* The monitor must never interfere with playback. */}
}
terminalPoll();setInterval(terminalPoll,3000);
const encoderMode=document.getElementById('encoderMode');
fetch('/api/encoder').then(r=>r.json()).then(d=>{encoderMode.value=d.mode}).catch(()=>terminalAdd('> ENCODER STATUS UNAVAILABLE'));
encoderMode.addEventListener('change',async()=>{try{const r=await fetch('/api/encoder',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:encoderMode.value})});if(!r.ok)throw Error(await r.text());terminalAdd('> ENCODER: '+encoderMode.value.toUpperCase()+' / STOP AND RESTART STREAM TO APPLY');}catch(e){terminalAdd('> ENCODER CHANGE FAILED: '+e.message)}});

// Simulated terminal: no shell execution. Exact submitted sequence only.
window.archiveUnlocked=false;
const forgeInput=document.getElementById('forgeCommand');
const forgeAchievement=document.getElementById('forgeAchievement');
const archiveTab=document.getElementById('archiveTab');
const archiveSlot=document.getElementById('archiveUnlockSlot');
const resetAchievement=document.getElementById('forgeReset');
function archiveUI(unlocked){
 window.archiveUnlocked=!!unlocked;
 archiveTab.hidden=!unlocked;archiveSlot.hidden=!!unlocked;archiveSlot.style.display=unlocked?'none':'';
 resetAchievement.hidden=!unlocked;
 if(!unlocked){document.getElementById('archiveFrame').removeAttribute('src');switchTab('link')}
}
function achievementSound(){
 try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;
 const ctx=new AudioCtx();[523.25,659.25,783.99,1046.5].forEach((hz,i)=>{
 const osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime+i*.12;
 osc.type='square';osc.frequency.value=hz;gain.gain.setValueAtTime(.0001,t);
 gain.gain.exponentialRampToValueAtTime(.07,t+.01);gain.gain.exponentialRampToValueAtTime(.0001,t+.13);
 osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+.15);
 });setTimeout(()=>ctx.close(),1000)}catch(e){}
}
function addTerminalCommand(line){
 const d=document.createElement('div');d.textContent='FORGE> '+line;
 const history=document.getElementById('monitorHistory');history.appendChild(d);
 while(history.children.length>200)history.firstChild.remove();history.scrollTop=history.scrollHeight;
}
async function submitForgeCommand(){
 const input=forgeInput.value.slice(0,160),normalized=input.toUpperCase();
 addTerminalCommand(input);forgeInput.value='';
 if(normalized!=='↑↑↓↓←→←→BA'||window.archiveUnlocked)return;
 try{const r=await fetch('/api/achievement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'unlock',code:normalized})});
 if(!r.ok)throw Error('Could not save achievement');
 archiveUI(true);forgeAchievement.textContent='★ ACHIEVEMENT UNLOCKED ★\nPRESERVATIONIST\nARCHIVE FORGE ONLINE';
 forgeAchievement.hidden=false;forgeAchievement.classList.add('unlocked');achievementSound();
 addTerminalCommand('★ ACHIEVEMENT UNLOCKED: PRESERVATIONIST ★');
 const banner=document.createElement('div');banner.className='achievement-banner';
 banner.textContent='★ PRESERVATIONIST UNLOCKED ★';
 banner.style.cssText='position:absolute;right:16px;top:100%;z-index:120;background:#082b22;color:#adffd1;border:2px solid #5cfaaf;padding:9px 14px;font:bold 12px Consolas,monospace;box-shadow:0 0 16px #34ffa066;pointer-events:none';
 document.querySelector('header').appendChild(banner);
 setTimeout(()=>{banner.remove();forgeAchievement.classList.remove('unlocked');forgeAchievement.hidden=true;},5000);
 }catch(e){terminalAdd('ACHIEVEMENT SAVE FAILED: '+e.message)}
}
forgeInput.addEventListener('keydown',e=>{
 const arrows={ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→'};
 if(arrows[e.key]){e.preventDefault();const start=forgeInput.selectionStart,end=forgeInput.selectionEnd;
 forgeInput.setRangeText(arrows[e.key],start,end,'end');return;}
 if(e.key==='Enter'){e.preventDefault();submitForgeCommand()}
 if(e.key==='Escape'){e.preventDefault();forgeInput.value=''}
});
document.getElementById('forgeSubmit').onclick=submitForgeCommand;
resetAchievement.onclick=async()=>{
 if(!confirm('Lock Archive Forge again? Existing archives and sources will be preserved.'))return;
 const r=await fetch('/api/achievement',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'reset'})});
 if(r.ok){archiveUI(false);forgeAchievement.textContent='';forgeAchievement.hidden=true;terminalAdd('ARCHIVE FORGE LOCKED')}else terminalAdd('RESET FAILED');
};
fetch('/api/achievement',{cache:'no-store'}).then(r=>r.json()).then(d=>{
 archiveUI(!!d.preservationist?.unlocked);
 if(window.archiveUnlocked&&location.hash==='#archive')switchTab('archive');
}).catch(()=>archiveUI(false));
</script></body></html>
